              *f (-not [int\]::TryParse(
        *         $env:INPUT_MONTHS,
      *           [ref]$parsedMonths
    *         )) {
                  th*ow "Der Parameter 'months' ist kei*e gültige Zahl."
              }

*             if ($parsedMonths -lt*1 -or $parsedMonths -gt 120) {
   *              throw "Der Parameter*'months' muss zwischen 1 und 120 l*egen."
              }

          *   $months = $parsedMonths
       *  }

          if ([string\]::IsNu*lOrWhiteSpace($env:INPUT_REFERENCE*DATE)) {
              $referenceD*te = [DateTime\]::UtcNow.Date
    *     }
          else {
          *   $culture = [System.Globalization.CultureInfo\]::InvariantCulture

*             $styles = [System.Globalization.DateTimeStyles\]::Assume*niversal

              $reference*ate = [DateTime\]::MinValue

     *        $success = [DateTime\]::Tr*ParseExact(
                  $env*INPUT_REFERENCE_DATE,
            *     "yyyy-MM-dd",
               *  $culture,
                  $sty*es,
                  [ref]$refere*ceDate
              )

          *   if (-not $success) {
          *       throw (
                   *  "Ungültiges Bezugsdatum " +
    *                 "'$($env:INPUT_RE*ERENCE_DATE)'. " +
               *      "Erwartetes Format: YYYY-MM-*D"
                  )
           *  }

              $referenceDate * $referenceDate.Date
          }

*         $fromDate = $referenceDat*.AddMonths(-$months)

          "m*nths=$months" |
              Out-*ile `
                  -FilePath *env:GITHUB_OUTPUT `
              *   -Encoding utf8 `
              *   -Append

          "reference-d*te=$($referenceDate.ToString('yyyy*MM-dd'))" |
              Out-File*`
                  -FilePath $env*GITHUB_OUTPUT `
                  *Encoding utf8 `
                  *Append

          "from-date=$($fr*mDate.ToString('yyyy-MM-dd'))" |
 *            Out-File `
           *      -FilePath $env:GITHUB_OUTPUT*`
                  -Encoding utf8*`
                  -Append

     *    Write-Host "Auswertungszeitrau*:"
          Write-Host "  Von:   *$($fromDate.ToString('yyyy-MM-dd')*"
          Write-Host "  Bis:    *($referenceDate.ToString('yyyy-MM-*d'))"
          Write-Host "  Mona*e: $months"

      # -------------*----------------------------------*-----------------------
      # Qu*lldatei prüfen
      # -----------*----------------------------------*-------------------------

      -*name: Validate source file
       *shell: pwsh
        run: |
       *  $ErrorActionPreference = "Stop"
*         Set-StrictMode -Version L*test

          if (-not (Test-Pat* -LiteralPath $env:SOURCE_FILE)) {*              throw "Quelldatei '$*nv:SOURCE_FILE' wurde nicht gefund*n."
          }

          $source*ile = Get-Item -LiteralPath $env:S*URCE_FILE

          if ($sourceFi*e.Length -eq 0) {
              th*ow "Quelldatei '$env:SOURCE_FILE' *st leer."
          }

          t*y {
              $jsonContent = G*t-Content `
                  -Lit*ralPath $env:SOURCE_FILE `
       *          -Raw `
                 *-Encoding UTF8

              $nul* = $jsonContent | ConvertFrom-Json*          }
          catch {
    *         throw (
                 *"'$env:SOURCE_FILE' enthält kein g*ltiges JSON. " +
                 *"Fehler: $($_.Exception.Message)"
*             )
          }

      *   Write-Host "JSON-Datei ist synt*ktisch gültig."

      # ---------*----------------------------------*---------------------------
      * Reports erzeugen
      # --------*----------------------------------*----------------------------

    * - name: Generate reports
        *d: report
        shell: pwsh
    *   env:
          FROM_DATE: ${{ s*eps.parameters.outputs.from-date }*
          REFERENCE_DATE: ${{ ste*s.parameters.outputs.reference-dat* }}
          MONTHS: ${{ steps.pa*ameters.outputs.months }}
        *un: |
          $ErrorActionPrefer*nce = "Stop"
          Set-StrictM*de -Version Latest

          $cul*ure = [System.Globalization.CultureInfo\]::InvariantCulture

        * $dateStyles = [System.Globalization.DateTimeStyles\]::AssumeUniversa*

          $fromDate = [DateTime\*::ParseExact(
              $env:F*OM_DATE,
              "yyyy-MM-dd*,
              $culture,
        *     $dateStyles
          ).Date
*          $referenceDate = [DateTime\]::ParseExact(
              $en*:REFERENCE_DATE,
              "yy*y-MM-dd",
              $culture,
*             $dateStyles
         *).Date

          # --------------*----------------------------------*------------------
          # Aus*abeverzeichnis anlegen
          #*----------------------------------*---------------------------------
*          New-Item `
             *-ItemType Directory `
            * -Path $env:OUTPUT_DIRECTORY `
   *          -Force |
              O*t-Null

          # --------------*----------------------------------*------------------
          # Que*ldatei einlesen
          # ------*----------------------------------*--------------------------

      *   $sourceContent = Get-Content `
*             -LiteralPath $env:SOU*CE_FILE `
              -Raw `
   *          -Encoding UTF8 |
       *      ConvertFrom-Json

          * Unterstützt ein JSON-Array und, z*r Sicherheit, ein einzelnes Objekt*
          $sourceEntries = @($sou*ceContent)

          $invalidEntr*es =
              [System.Collections.Generic.List[object]\]::new()
*          $matchingEntries =
     *        [System.Collections.Generic.List[object]\]::new()

          * ---------------------------------*----------------------------------*          # Einträge prüfen und fi*tern
          # -----------------*----------------------------------*---------------

          foreach*($entry in $sourceEntries) {
     *        $obsoleteSinceProperty =
 *                $entry.PSObject.Pr*perties["obsolete-since"]

       *      if (
                  $null*-eq $obsoleteSinceProperty -or
   *              [string\]::IsNullOrW*iteSpace(
                      [string]$obsoleteSinceProperty.Value
*                 )
              )*{
                  continue
     *        }

              $obsolete*ince = [DateTime\]::MinValue

    *         $isValidDate = [DateTime\*::TryParseExact(
                 *[string]$obsoleteSinceProperty.Val*e,
                  "yyyy-MM-dd",*                  $culture,
      *           $dateStyles,
          *       [ref]$obsoleteSince
       *      )

              if (-not $i*ValidDate) {
                  $in*alidEntries.Add($entry)
          *       continue
              }

 *            $obsoleteSince = $obso*eteSince.Date

              # Bei*e Grenzen sind inklusive.
        *     if (
                  $obsol*teSince -ge $fromDate -and
       *          $obsoleteSince -le $refe*enceDate
              ) {
       *          $matchingEntries.Add($en*ry)
              }
          }

 *        if ($invalidEntries.Count *gt 0) {
              Write-Warnin* (
                  "$($invalidEn*ries.Count) Einträge enthalten ein*" +
                  "ungültiges *obsolete-since'-Datum. " +
       *          "Erwartetes Format: YYYY*MM-DD."
              )
          *

          # --------------------*----------------------------------*------------
          # Ergebniss* sortieren
          # -----------*----------------------------------*---------------------

          $*ortedEntries = @(
              $m*tchingEntries |
                  *ort-Object {
                     *[DateTime\]::ParseExact(
         *                [string]$_.'obsole*e-since',
                        * "yyyy-MM-dd",
                   *      $culture,
                  *       $dateStyles
               *      )
                  }
      *   )

          # ----------------*----------------------------------*----------------
          # Hilfs*unktion: Eigenschaft sicher lesen
*         # -----------------------*----------------------------------*---------

          function Get-*ropertyValue {
              param*
                  [Parameter(Mandatory)]
                  [object]$*nputObject,

                  [Parameter(Mandatory)]
               *  [string]$PropertyName
          *   )

              $property =
  *           }

              return $property.Value
          }

          # --------------------------------------------------------------------
          # Hilfsfunktion: Service-Identifier bestimmen
          # --------------------------------------------------------------------

          function Get-EntryIdentifier {
              param(
                  [Parameter(Mandatory)]
                  [object]$Entry
              )

              $candidateProperties = @(
                  "service"
                  "name"
                  "id"
                  "artifact"
                  "contract"
              )

              foreach ($propertyName in $candidateProperties) {
                  $value = Get-PropertyValue `
                      -InputObject $Entry `
                      -PropertyName $propertyName

                  if (-not :IsNullOrWhiteSpace([string]$value)) {
                      return [string]$value
                  }
              }

              foreach ($property in $Entry.PSObject.Properties) {
                  if (
                      $property.Name -ne "obsolete-since" -and
                      -not :IsNullOrWhiteSpace(
                          [string]$property.Value
                      )
                  ) {
                      return [string]$property.Value
                  }
              }

              return "(unbekannter Service)"
          }

          # --------------------------------------------------------------------
          # Hilfsfunktion: Markdown-Zellen schützen
          # --------------------------------------------------------------------

          function ConvertTo-MarkdownCell {
              param(
                  [AllowNull()]
                  [object]$Value
              )

              if ($null -eq $Value) {
                  return ""
              }

              return ([string]$Value).
                  Replace("|", "\|").
                  Replace("`r", " ").
                  Replace("`n", " ")
          }

          # --------------------------------------------------------------------
          # Zieldateien
          # --------------------------------------------------------------------

          $jsonPath = Join-Path `
              $env:OUTPUT_DIRECTORY `
              "obsolete-services.json"

          $csvPath = Join-Path `
              $env:OUTPUT_DIRECTORY `
              "obsolete-services.csv"

          $markdownPath = Join-Path `
              $env:OUTPUT_DIRECTORY `
              "obsolete-services.md"

          # --------------------------------------------------------------------
          # JSON-Bericht erzeugen
          # --------------------------------------------------------------------

          $jsonReport = [ordered]@{
              generatedAtUtc = :UtcNow.ToString("o")

              source = $env:SOURCE_FILE

              period = [ordered]@{
                  months = [int]$env:MONTHS
                  from = $fromDate.ToString("yyyy-MM-dd")
                  to = $referenceDate.ToString("yyyy-MM-dd")
              }

              count = $sortedEntries.Count

              invalidDateCount = $invalidEntries.Count

              services = $sortedEntries
          }

          $jsonReport |
              ConvertTo-Json -Depth 100 |
              Set-Content `
                  -LiteralPath $jsonPath `
                  -Encoding UTF8

          # --------------------------------------------------------------------
          # CSV-Bericht erzeugen
          # --------------------------------------------------------------------

          if ($sortedEntries.Count -gt 0) {
              $sortedEntries |
                  Export-Csv `
                      -LiteralPath $csvPath `
                      -NoTypeInformation `
                      -Encoding UTF8 `
                      -UseQuotes AsNeeded
          }
          else {
              '"obsolete-since"' |
                  Set-Content `
                      -LiteralPath $csvPath `
                      -Encoding UTF8
          }

          # --------------------------------------------------------------------
          # Markdown-Bericht erzeugen
          # --------------------------------------------------------------------

          $markdown =
              [System.Collections.Generic.List[string]]::new()

          $markdown.Add("# Obsolete Services")
          $markdown.Add("")

          $markdown.Add(
              "Auswertungszeitraum: " +
              "**$($fromDate.ToString('yyyy-MM-dd'))** bis " +
              "**$($referenceDate.ToString('yyyy-MM-dd'))**"
          )

          $markdown.Add("")

          $markdown.Add(
              "Gefundene Einträge: **$($sortedEntries.Count)**"
          )

          $markdown.Add("")

          if ($sortedEntries.Count -eq 0) {
              $markdown.Add(
                  "Im Auswertungszeitraum wurden keine Services obsolet."
              )
          }
          else {
              $markdown.Add(
                  "| Service | Obsolet seit | Nachfolger | " +
                  "Abkündigungsversion | Abkündigungsdatum |"
              )

              $markdown.Add(
                  "|---|---:|---|---|---:|"
              )

              foreach ($entry in $sortedEntries) {
                  $identifier = Get-EntryIdentifier -Entry $entry

                  $successor = Get-PropertyValue `
                      -InputObject $entry `
                      -PropertyName "successor"

                  $discontinuationVersion = Get-PropertyValue `
                      -InputObject $entry `
                      -PropertyName "discontinuation-version"

                  $discontinuationDate = Get-PropertyValue `
                      -InputObject $entry `
                      -PropertyName "discontinuation-date"

                  $obsoleteSince = Get-PropertyValue `
                      -InputObject $entry `
                      -PropertyName "obsolete-since"

                  $row = @(
                      ConvertTo-MarkdownCell $identifier
                      ConvertTo-MarkdownCell $obsoleteSince
                      ConvertTo-MarkdownCell $successor
                      ConvertTo-MarkdownCell $discontinuationVersion
                      ConvertTo-MarkdownCell $discontinuationDate
                  ) -join " | "

                  $markdown.Add("| $row |")
              }
          }

          if ($invalidEntries.Count -gt 0) {
              $markdown.Add("")

              $markdown.Add(
                  "> Warnung: $($invalidEntries.Count) Einträge wurden wegen " +
                  "eines ungültigen `obsolete-since`-Datums nicht ausgewertet."
              )
          }

          $markdown |
              Set-Content `
                  -LiteralPath $markdownPath `
                  -Encoding UTF8

          # --------------------------------------------------------------------
          # Ausgaben für nachfolgende Workflow-Schritte
          # --------------------------------------------------------------------

          "count=$($sortedEntries.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          "invalid-count=$($invalidEntries.Count)" |
              Out-File `
                  -FilePath $env:GITHUB_OUTPUT `
                  -Encoding utf8 `
                  -Append

          Write-Host ""
          Write-Host "Gefundene Services:      $($sortedEntries.Count)"
          Write-Host "Ungültige Datumswerte:  $($invalidEntries.Count)"
          Write-Host "Ausgabeverzeichnis:     $env:OUTPUT_DIRECTORY"

      # ------------------------------------------------------------------------
      # Zusammenfassung des Workflow-Laufs erzeugen
      # ------------------------------------------------------------------------

      - name: Publish job summary
        shell: pwsh
        env:
          FROM_DATE: ${{ steps.parameters.outputs.from-date }}
          REFERENCE_DATE: ${{ steps.parameters.outputs.reference-date }}
          RESULT_COUNT: ${{ steps.report.outputs.count }}
          INVALID_COUNT: ${{ steps.report.outputs.invalid-count }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          @"
          # Auswertung obsoleter Services

          **Quelle:** ``$env:SOURCE_FILE``

          **Zeitraum:** $env:FROM_DATE bis $env:REFERENCE_DATE

          **Gefundene Einträge:** $env:RESULT_COUNT

          **Einträge mit ungültigem Datum:** $env:INVALID_COUNT

          "@ |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append

          Get-Content `
              -LiteralPath "$env:OUTPUT_DIRECTORY/obsolete-services.md" `
              -Raw `
              -Encoding UTF8 |
              Out-File `
                  -FilePath $env:GITHUB_STEP_SUMMARY `
                  -Encoding utf8 `
                  -Append

      # ------------------------------------------------------------------------
      # Reports als GitHub Actions Artifact hochladen
      # ------------------------------------------------------------------------

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-services-${{ steps.parameters.outputs.from-date }}-${{ steps.parameters.outputs.reference-date }}
          path: |
            out/obsolete-services.json
            out/obsolete-services.csv
            out/obsolete-services.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 6