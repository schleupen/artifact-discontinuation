# ==============================================================================
# Konfiguration / benötigte Variablen
# ==============================================================================
#
# Für diese Action müssen KEINE GitHub Repository Variables oder Secrets
# konfiguriert werden.
#
# Die Action verwendet folgende Konfigurationswerte:
#
# 1. SOURCE_FILE
#    Pfad zur JSON-Datei mit den obsoleten Services.
#
#    Wird unten im Abschnitt "env:" definiert:
#
#      SOURCE_FILE: Services/obsolete.json
#
#    Die Datei muss im Repository vorhanden sein.
#
#
# 2. OUTPUT_DIRECTORY
#    Verzeichnis, in dem die erzeugten Reports temporär abgelegt werden.
#
#    Wird unten im Abschnitt "env:" definiert:
#
#      OUTPUT_DIRECTORY: out
#
#    Das Verzeichnis muss nicht existieren. Die Action legt es automatisch an.
#
#
# 3. months
#    Anzahl der Monate, die rückwirkend betrachtet werden.
#
#    Standardwert:
#
#      6
#
#    Bei automatischer Ausführung (push/schedule) werden 6 Monate verwendet.
#    Bei manueller Ausführung über "workflow_dispatch" kann der Wert ausgewählt
#    werden.
#
#    Unterstützte Werte:
#
#      1, 3, 6, 12, 24
#
#
# 4. reference_date
#    Optionales Bezugsdatum für die Berechnung des Zeitraums.
#
#    Format:
#
#      YYYY-MM-DD
#
#    Beispiel:
#
#      2026-10-19
#
#    Wird kein Wert angegeben, verwendet die Action das aktuelle UTC-Datum.
#
#    Das Bezugsdatum ist hauptsächlich dafür gedacht, vergangene Auswertungen
#    reproduzierbar ausführen und testen zu können.
#
#
# 5. FROM_DATE
#    Muss NICHT konfiguriert werden.
#
#    Wird von der Action automatisch berechnet:
#
#      FROM_DATE = reference_date - months
#
#    Beispiel:
#
#      reference_date = 2026-10-19
#      months         = 6
#
#      FROM_DATE      = 2026-04-19
#
#
# 6. REFERENCE_DATE
#    Muss NICHT konfiguriert werden.
#
#    Wird aus "reference_date" ermittelt oder auf das aktuelle UTC-Datum gesetzt.
#
#
# 7. MONTHS
#    Muss NICHT konfiguriert werden.
#
#    Wird aus dem workflow_dispatch-Parameter "months" übernommen.
#    Bei push/schedule wird automatisch der Standardwert 6 verwendet.
#
#
# GitHub-interne Variablen
# ------------------------------------------------------------------------------
#
# Die folgenden Variablen werden automatisch von GitHub Actions bereitgestellt
# und dürfen NICHT als Repository Variable angelegt werden:
#
#   GITHUB_OUTPUT
#   GITHUB_STEP_SUMMARY
#
#
# Credentials / Secrets
# ------------------------------------------------------------------------------
#
# Es werden KEINE zusätzlichen Credentials benötigt, solange sich
# Services/obsolete.json im selben Repository wie diese Action befindet.
#
# Insbesondere werden nicht benötigt:
#
#   - SSH Private Key
#   - GitHub Personal Access Token (PAT)
#   - Repository Secret
#   - Repository Variable
#
# actions/checkout verwendet die von GitHub Actions bereitgestellte
# Authentifizierung. Der Workflow benötigt lediglich:
#
#   permissions:
#     contents: read
#
#
# Ergebnis
# ------------------------------------------------------------------------------
#
# Die Action erzeugt:
#
#   out/obsolete-services.json
#   out/obsolete-services.csv
#   out/obsolete-services.md
#
# Diese Dateien werden anschließend als GitHub Actions Artifact hochgeladen.
#
# ==============================================================================

name: Report obsolete services

run-name: >-
  Obsolete services report
  (${{
    github.event_name == 'workflow_dispatch'
    && inputs.months
    || '6'
  }} months)

on:
  push:
    branches:
      - main
    paths:
      - "Services/obsolete.json"
      - ".github/workflows/report-obsolete-services.yml"

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      months:
        description: "Betrachtungszeitraum in Monaten"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "12"
          - "24"

      reference_date:
        description: "Optionales Bezugsdatum im Format YYYY-MM-DD"
        required: false
        default: ""
        type: string

jobs:
  report:
    name: Create obsolete services report
    runs-on: ubuntu-latest

    permissions:
      contents: read

    timeout-minutes: 10

    env:
      SOURCE_FILE: Services/obsolete.json
      OUTPUT_DIRECTORY: report

    steps:

      # ----------------------------------------------------------------------
      # Repository auschecken
      # ----------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------------------------------------
      # Zeitraum bestimmen
      # ----------------------------------------------------------------------

      - name: Determine parameters
        id: parameters
        shell: pwsh
        env:
          INPUT_MONTHS: ${{ inputs.months }}
          INPUT_REFERENCE_DATE: ${{ inputs.reference_date }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $months = 6

          if (-not [string\]::IsNullOrWhiteSpace($env:INPUT_MONTHS)) {

              $parsedMonths = 0

              if (-not [int\]::TryParse(
                  $env:INPUT_MONTHS,
                  [ref]$parsedMonths
              )) {
                  throw "Der Parameter 'months' ist keine gültige Zahl."
              }

              if ($parsedMonths -lt 1 -or $parsedMonths -gt 120) {
                  throw "Der Parameter 'months' muss zwischen 1 und 120 liegen."
              }

              $months = $parsedMonths
          }

          if ([string\]::IsNullOrWhiteSpace($env:INPUT_REFERENCE_DATE)) {

              $referenceDate = [DateTime\]::UtcNow.Date

          } else {

              $culture =
                  [System.Globalization.CultureInfo\]::InvariantCulture

              $styles =
                  [System.Globalization.DateTimeStyles\]::AssumeUniversal

              $referenceDate = [DateTime\]::MinValue

              $success = [DateTime\]::TryParseExact(
                  $env:INPUT_REFERENCE_DATE,
                  "yyyy-MM-dd",
                  $culture,
                  $styles,
                  [ref]$referenceDate
              )

              if (-not $success) {
                  throw "Ungültiges Bezugsdatum '$($env:INPUT_REFERENCE_DATE)'. Erwartetes Format: YYYY-MM-DD"
              }

              $referenceDate = $referenceDate.Date
          }

          $fromDate = $referenceDate.AddMonths(-$months)

          "months=$months" >> $env:GITHUB_OUTPUT
          "reference-date=$($referenceDate.ToString('yyyy