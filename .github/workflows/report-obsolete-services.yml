# ==============================================================================
# GitHub Action: Report obsolete services
# ==============================================================================
#
# Zweck
# ------------------------------------------------------------------------------
# Diese Action liest Services/obsolete.json und ermittelt alle Eintraege, deren
# Feld "obsolete-since" innerhalb des konfigurierten Zeitraums liegt.
# Standardmaessig werden die letzten 6 Kalendermonate betrachtet.
#
# Benoetigte Repository-Variablen / Secrets
# ------------------------------------------------------------------------------
# Es muessen KEINE GitHub Repository Variables und KEINE Secrets angelegt werden.
# Insbesondere werden kein SSH-Key und kein PAT benoetigt.
#
# Konfiguration im Workflow
# ------------------------------------------------------------------------------
# SOURCE_FILE:
#   Pfad zur auszuwertenden JSON-Datei.
#   Standard: Services/obsolete.json
#
# OUTPUT_DIRECTORY:
#   Verzeichnis fuer die erzeugten Reports.
#   Standard: out
#
# Manuelle Eingaben (workflow_dispatch)
# ------------------------------------------------------------------------------
# months:
#   Anzahl der zurueckliegenden Kalendermonate.
#   Erlaubt: 1, 3, 6, 12, 24
#   Standard: 6
#
# reference_date:
#   Optionales Bezugsdatum im Format YYYY-MM-DD.
#   Leer = aktuelles UTC-Datum.
#
# Automatisch berechnete Variablen
# ------------------------------------------------------------------------------
# FROM_DATE       = REFERENCE_DATE minus MONTHS
# REFERENCE_DATE  = reference_date oder aktuelles UTC-Datum
# MONTHS          = months oder 6 bei push/schedule
#
# Von GitHub bereitgestellte Variablen
# ------------------------------------------------------------------------------
# GITHUB_OUTPUT
# GITHUB_STEP_SUMMARY
#
# Diese Variablen duerfen nicht selbst als Repository Variables angelegt werden.
#
# Erwartetes JSON
# ------------------------------------------------------------------------------
# Die Quelle sollte ein JSON-Array enthalten. Massgeblich ist "obsolete-since"
# im Format YYYY-MM-DD. Fehlende Werte werden ignoriert, ungueltige Datumswerte
# werden gezaehlt und nicht ausgewertet.
#
# Erzeugte Dateien
# ------------------------------------------------------------------------------
# out/obsolete-services.json
# out/obsolete-services.csv
# out/obsolete-services.md
#
# ===============================================================================

name: Report obsolete services

run-name: >-
  Obsolete services report
  (${{ github.event_name == 'workflow_dispatch' && inputs.months || '6' }} months)

on:
  push:
    branches:
      - main
    paths:
      - "Services/obsolete.json"
      - ".github/workflows/report-obsolete-services.yml"

  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      months:
        description: "Betrachtungszeitraum in Monaten"
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "3"
          - "6"
          - "12"
          - "24"

      reference_date:
        description: "Optionales Bezugsdatum im Format YYYY-MM-DD"
        required: false
        default: ""
        type: string

jobs:
  report:
    name: Create obsolete services report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      SOURCE_FILE: Services/obsolete.json
      OUTPUT_DIRECTORY: out

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine parameters
        id: parameters
        shell: pwsh
        env:
          INPUT_MONTHS: ${{ inputs.months }}
          INPUT_REFERENCE_DATE: ${{ inputs.reference_date }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $months = 6

          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_MONTHS)) {
              $parsedMonths = 0

              if (-not [int]::TryParse($env:INPUT_MONTHS, [ref]$parsedMonths)) {
                  throw "Der Parameter 'months' ist keine gueltige Zahl."
              }

              if ($parsedMonths -lt 1 -or $parsedMonths -gt 120) {
                  throw "Der Parameter 'months' muss zwischen 1 und 120 liegen."
              }

              $months = $parsedMonths
          }

          if ([string]::IsNullOrWhiteSpace($env:INPUT_REFERENCE_DATE)) {
              $referenceDate = [DateTime]::UtcNow.Date
          }
          else {
              $culture = [System.Globalization.CultureInfo]::InvariantCulture
              $styles = [System.Globalization.DateTimeStyles]::AssumeUniversal
              $referenceDate = [DateTime]::MinValue

              $success = [DateTime]::TryParseExact(
                  $env:INPUT_REFERENCE_DATE,
                  "yyyy-MM-dd",
                  $culture,
                  $styles,
                  [ref]$referenceDate
              )

              if (-not $success) {
                  throw "Ungueltiges Bezugsdatum '$($env:INPUT_REFERENCE_DATE)'. Erwartetes Format: YYYY-MM-DD"
              }

              $referenceDate = $referenceDate.Date
          }

          $fromDate = $referenceDate.AddMonths(-$months)

          "months=$months" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reference-date=$($referenceDate.ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "from-date=$($fromDate.ToString('yyyy-MM-dd'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Auswertungszeitraum:"
          Write-Host "  Von:    $($fromDate.ToString('yyyy-MM-dd'))"
          Write-Host "  Bis:    $($referenceDate.ToString('yyyy-MM-dd'))"
          Write-Host "  Monate: $months"

      - name: Validate source file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          if (-not (Test-Path -LiteralPath $env:SOURCE_FILE)) {
              throw "Quelldatei '$env:SOURCE_FILE' wurde nicht gefunden."
          }

          $sourceFile = Get-Item -LiteralPath $env:SOURCE_FILE

          if ($sourceFile.Length -eq 0) {
              throw "Quelldatei '$env:SOURCE_FILE' ist leer."
          }

          try {
              $jsonContent = Get-Content -LiteralPath $env:SOURCE_FILE -Raw -Encoding UTF8
              $null = $jsonContent | ConvertFrom-Json
          }
          catch {
              throw "'$env:SOURCE_FILE' enthaelt kein gueltiges JSON. Fehler: $($_.Exception.Message)"
          }

          Write-Host "JSON-Datei ist syntaktisch gueltig."

      - name: Generate reports
        id: report
        shell: pwsh
        env:
          FROM_DATE: ${{ steps.parameters.outputs.from-date }}
          REFERENCE_DATE: ${{ steps.parameters.outputs.reference-date }}
          MONTHS: ${{ steps.parameters.outputs.months }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $culture = [System.Globalization.CultureInfo]::InvariantCulture
          $dateStyles = [System.Globalization.DateTimeStyles]::AssumeUniversal

          $fromDate = [DateTime]::ParseExact(
              $env:FROM_DATE,
              "yyyy-MM-dd",
              $culture,
              $dateStyles
          ).Date

          $referenceDate = [DateTime]::ParseExact(
              $env:REFERENCE_DATE,
              "yyyy-MM-dd",
              $culture,
              $dateStyles
          ).Date

          New-Item -ItemType Directory -Path $env:OUTPUT_DIRECTORY -Force | Out-Null

          $sourceContent = Get-Content -LiteralPath $env:SOURCE_FILE -Raw -Encoding UTF8 | ConvertFrom-Json
          $sourceEntries = @($sourceContent)

          $invalidEntries = [System.Collections.Generic.List[object]]::new()
          $matchingEntries = [System.Collections.Generic.List[object]]::new()

          foreach ($entry in $sourceEntries) {
              $obsoleteSinceProperty = $entry.PSObject.Properties["obsolete-since"]

              if (
                  $null -eq $obsoleteSinceProperty -or
                  [string]::IsNullOrWhiteSpace([string]$obsoleteSinceProperty.Value)
              ) {
                  continue
              }

              $obsoleteSince = [DateTime]::MinValue

              $isValidDate = [DateTime]::TryParseExact(
                  [string]$obsoleteSinceProperty.Value,
                  "yyyy-MM-dd",
                  $culture,
                  $dateStyles,
                  [ref]$obsoleteSince
              )

              if (-not $isValidDate) {
                  $invalidEntries.Add($entry)
                  continue
              }

              $obsoleteSince = $obsoleteSince.Date

              if ($obsoleteSince -ge $fromDate -and $obsoleteSince -le $referenceDate) {
                  $matchingEntries.Add($entry)
              }
          }

          if ($invalidEntries.Count -gt 0) {
              Write-Warning "$($invalidEntries.Count) Eintraege enthalten ein ungueltiges 'obsolete-since'-Datum. Erwartetes Format: YYYY-MM-DD."
          }

          $sortedEntries = @(
              $matchingEntries |
                  Sort-Object {
                      [DateTime]::ParseExact(
                          [string]$_.'obsolete-since',
                          "yyyy-MM-dd",
                          $culture,
                          $dateStyles
                      )
                  }
          )

          function Get-PropertyValue {
              param(
                  [Parameter(Mandatory)]
                  [object]$InputObject,

                  [Parameter(Mandatory)]
                  [string]$PropertyName
              )

              $property = $InputObject.PSObject.Properties[$PropertyName]

              if ($null -eq $property) {
                  return $null
              }

              return $property.Value
          }

          function Get-EntryIdentifier {
              param(
                  [Parameter(Mandatory)]
                  [object]$Entry
              )

              $candidateProperties = @(
                  "service",
                  "name",
                  "id",
                  "artifact",
                  "contract"
              )

              foreach ($propertyName in $candidateProperties) {
                  $value = Get-PropertyValue -InputObject $Entry -PropertyName $propertyName

                  if (-not [string]::IsNullOrWhiteSpace([string]$value)) {
                      return [string]$value
                  }
              }

              foreach ($property in $Entry.PSObject.Properties) {
                  if (
                      $property.Name -ne "obsolete-since" -and
                      -not [string]::IsNullOrWhiteSpace([string]$property.Value)
                  ) {
                      return [string]$property.Value
                  }
              }

              return "(unbekannter Service)"
          }

          function ConvertTo-MarkdownCell {
              param(
                  [AllowNull()]
                  [object]$Value
              )

              if ($null -eq $Value) {
                  return ""
              }

              return ([string]$Value).Replace("|", "\|").Replace("`r", " ").Replace("`n", " ")
          }

          $jsonPath = Join-Path $env:OUTPUT_DIRECTORY "obsolete-services.json"
          $csvPath = Join-Path $env:OUTPUT_DIRECTORY "obsolete-services.csv"
          $markdownPath = Join-Path $env:OUTPUT_DIRECTORY "obsolete-services.md"

          $jsonReport = [ordered]@{
              generatedAtUtc = [DateTime]::UtcNow.ToString("o")
              source = $env:SOURCE_FILE
              period = [ordered]@{
                  months = [int]$env:MONTHS
                  from = $fromDate.ToString("yyyy-MM-dd")
                  to = $referenceDate.ToString("yyyy-MM-dd")
              }
              count = $sortedEntries.Count
              invalidDateCount = $invalidEntries.Count
              services = $sortedEntries
          }

          $jsonReport |
              ConvertTo-Json -Depth 100 |
              Set-Content -LiteralPath $jsonPath -Encoding UTF8

          if ($sortedEntries.Count -gt 0) {
              $sortedEntries |
                  Export-Csv -LiteralPath $csvPath -NoTypeInformation -Encoding UTF8 -UseQuotes AsNeeded
          }
          else {
              '"obsolete-since"' | Set-Content -LiteralPath $csvPath -Encoding UTF8
          }

          $markdown = [System.Collections.Generic.List[string]]::new()

          $markdown.Add("# Obsolete Services")
          $markdown.Add("")
          $markdown.Add("Auswertungszeitraum: $($fromDate.ToString('yyyy-MM-dd')) bis $($referenceDate.ToString('yyyy-MM-dd'))")
          $markdown.Add("")
          $markdown.Add("Gefundene Eintraege: $($sortedEntries.Count)")
          $markdown.Add("")

          if ($sortedEntries.Count -eq 0) {
              $markdown.Add("Im Auswertungszeitraum wurden keine Services obsolet.")
          }
          else {
              $markdown.Add("| Service | Obsolet seit | Nachfolger | Abkuendigungsversion | Abkuendigungsdatum |")
              $markdown.Add("|---|---|---|---|---|")

              foreach ($entry in $sortedEntries) {
                  $identifier = Get-EntryIdentifier -Entry $entry
                  $obsoleteSince = Get-PropertyValue -InputObject $entry -PropertyName "obsolete-since"
                  $successor = Get-PropertyValue -InputObject $entry -PropertyName "successor"
                  $discontinuationVersion = Get-PropertyValue -InputObject $entry -PropertyName "discontinuation-version"
                  $discontinuationDate = Get-PropertyValue -InputObject $entry -PropertyName "discontinuation-date"

                  $row = @(
                      ConvertTo-MarkdownCell $identifier
                      ConvertTo-MarkdownCell $obsoleteSince
                      ConvertTo-MarkdownCell $successor
                      ConvertTo-MarkdownCell $discontinuationVersion
                      ConvertTo-MarkdownCell $discontinuationDate
                  ) -join " | "

                  $markdown.Add("| $row |")
              }
          }

          if ($invalidEntries.Count -gt 0) {
              $markdown.Add("")
              $markdown.Add("> Warnung: $($invalidEntries.Count) Eintraege wurden wegen eines ungueltigen obsolete-since-Datums nicht ausgewertet.")
          }

          $markdown | Set-Content -LiteralPath $markdownPath -Encoding UTF8

          "count=$($sortedEntries.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "invalid-count=$($invalidEntries.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          Write-Host "Gefundene Services: $($sortedEntries.Count)"
          Write-Host "Ungueltige Datumswerte: $($invalidEntries.Count)"
          Write-Host "Ausgabeverzeichnis: $env:OUTPUT_DIRECTORY"

      - name: Publish job summary
        shell: pwsh
        env:
          FROM_DATE: ${{ steps.parameters.outputs.from-date }}
          REFERENCE_DATE: ${{ steps.parameters.outputs.reference-date }}
          RESULT_COUNT: ${{ steps.report.outputs.count }}
          INVALID_COUNT: ${{ steps.report.outputs.invalid-count }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          @"
          # Auswertung obsoleter Services

          Quelle: $env:SOURCE_FILE

          Zeitraum: $env:FROM_DATE bis $env:REFERENCE_DATE

          Gefundene Eintraege: $env:RESULT_COUNT

          Eintraege mit ungueltigem Datum: $env:INVALID_COUNT

          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Get-Content -LiteralPath "$env:OUTPUT_DIRECTORY/obsolete-services.md" -Raw -Encoding UTF8 |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-services-${{ steps.parameters.outputs.from-date }}-${{ steps.parameters.outputs.reference-date }}
          path: |
            out/obsolete-services.json
            out/obsolete-services.csv
            out/obsolete-services.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
