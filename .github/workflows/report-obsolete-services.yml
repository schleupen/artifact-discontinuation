# ==============================================================================
# GitHub Action: Report obsolete services
# ==============================================================================
#
# Zweck
# ------------------------------------------------------------------------------
#
# Diese Action liest die Datei:
#
#   Services/obsolete.json
#
# und ermittelt alle Services, deren Feld "obsolete-since" innerhalb des
# konfigurierten Zeitraums liegt.
#
# Standardmäßig werden die letzten sechs Kalendermonate betrachtet.
#
#
# Ausführung
# ------------------------------------------------------------------------------
#
# Die Action wird ausgeführt:
#
#   1. bei Änderungen an Services/obsolete.json auf dem Branch main,
#   2. bei Änderungen an dieser Workflow-Datei,
#   3. täglich um 06:00 UTC,
#   4. manuell über GitHub Actions.
#
#
# Benötigte Repository-Variablen
# ------------------------------------------------------------------------------
#
# Es müssen KEINE GitHub Repository Variables angelegt werden.
#
#
# Benötigte Secrets
# ------------------------------------------------------------------------------
#
# Es müssen KEINE GitHub Secrets angelegt werden.
#
# Insbesondere werden nicht benötigt:
#
#   - SSH Private Key
#   - GitHub Personal Access Token (PAT)
#   - Benutzername oder Passwort
#   - eigener GitHub-Token
#
# Die Action greift ausschließlich lesend auf das Repository zu.
# Die Authentifizierung erfolgt automatisch durch GitHub Actions.
#
#
# Konfigurierbare Umgebungsvariablen
# ------------------------------------------------------------------------------
#
# SOURCE_FILE
#
#   Pfad zur auszuwertenden JSON-Datei relativ zum Repository-Stamm.
#
#   Standard:
#
#     Services/obsolete.json
#
#
# OUTPUT_DIRECTORY
#
#   Temporäres Verzeichnis für die erzeugten Dateien.
#
#   Standard:
#
#     out
#
#   Das Verzeichnis wird bei Bedarf automatisch angelegt.
#
#
# Eingaben bei manueller Ausführung
# ------------------------------------------------------------------------------
#
# months
#
#   Anzahl der zurückliegenden Kalendermonate.
#
#   Erlaubte Werte:
#
#     1, 3, 6, 12, 24
#
#   Standard:
#
#     6
#
#   Bei einer automatischen Ausführung über push oder schedule werden
#   standardmäßig sechs Monate verwendet.
#
#
# reference_date
#
#   Optionales Bezugsdatum im Format:
#
#     YYYY-MM-DD
#
#   Beispiel:
#
#     2026-10-19
#
#   Wenn kein Bezugsdatum angegeben wird, verwendet die Action das aktuelle
#   UTC-Datum.
#
#   Mit einem festen Bezugsdatum kann eine vergangene Auswertung reproduzierbar
#   erneut ausgeführt werden.
#
#
# Automatisch berechnete Variablen
# ------------------------------------------------------------------------------
#
# FROM_DATE
#
#   Beginn des Auswertungszeitraums.
#
#   Berechnung:
#
#     reference_date minus months
#
#
# REFERENCE_DATE
#
#   Ende des Auswertungszeitraums.
#
#   Entspricht dem angegebenen reference_date oder dem aktuellen UTC-Datum.
#
#
# MONTHS
#
#   Effektiv verwendete Anzahl der Monate.
#
#
# Von GitHub bereitgestellte Variablen
# ------------------------------------------------------------------------------
#
# GITHUB_OUTPUT
#
#   Wird verwendet, um Werte zwischen Workflow-Schritten zu übergeben.
#
#
# GITHUB_STEP_SUMMARY
#
#   Wird verwendet, um den Markdown-Bericht in der Zusammenfassung des
#   Workflow-Laufs darzustellen.
#
# Diese Variablen dürfen nicht selbst als Repository Variables angelegt werden.
#
#
# Erwartetes Format von Services/obsolete.json
# ------------------------------------------------------------------------------
#
# Die Quelldatei muss ein JSON-Array enthalten.
#
# Beispiel:
#
#   [
#     {
#       "service": "Example.Service",
#       "successor": "Example.NewService",
#       "discontinuation-version": "WV27",
#       "discontinuation-date": null,
#       "obsolete-since": "2026-05-15"
#     }
#   ]
#
# Maßgebliches Feld:
#
#   obsolete-since
#
# Erwartetes Datumsformat:
#
#   YYYY-MM-DD
#
# Einträge ohne "obsolete-since" werden ignoriert.
#
# Einträge mit einem ungültigen "obsolete-since"-Datum werden nicht ausgewertet
# und im Bericht als ungültig gezählt.
#
#
# Erzeugte Dateien
# ------------------------------------------------------------------------------
#
#   out/obsolete-services.json
#   out/obsolete-services.csv
#   out/obsolete-services.md
#
# Die Dateien werden als GitHub Actions Artifact hochgeladen und 30 Tage
# aufbewahrt.
#
# ==============================================================================

name: Report obsolete services

run-name: >-
  Obsolete services report
  (${{ github.event_name == 'workflow_dispatch' && inputs.months || '6' }} months)

on:
  push:
    branches:
      - main
    paths:
      - "Services/obsolete.json"
      - ".github/workflows/report-obsolete-services.yml"

  schedule:
    # Täglich um 06:00 UTC
    - cron: "0 6 * * *"

  workflow_dispatch:
    i*puts:
      months:
        descri*tion: "Betrachtungszeitraum in Mon*ten"
        required: true
      * default: "6"
        type: choice*        options:
          - "1"
 *        - "3"
          - "6"
    *     - "12"
          - "24"

    * reference_date:
        descripti*n: "Optionales Bezugsdatum im Form*t YYYY-MM-DD"
        required: fa*se
        default: ""
        typ*: string

